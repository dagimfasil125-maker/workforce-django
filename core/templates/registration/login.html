{% extends "core/base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="container-sm">
  <h1 style="text-align:center;">Welcome back</h1>
  <p class="subtitle" style="text-align:center;">Sign in to Workforce Task Management</p>

  <div class="card">
    {% if form.errors %}
      <div class="alert alert-error">Invalid username or password.</div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <label for="id_username">Username</label>
      <input type="text" name="username" id="id_username" required autofocus>
      <label for="id_password">Password</label>
      <input type="password" name="password" id="id_password" required>
      <button type="submit" class="btn btn-primary btn-block" style="margin-top:16px;">Sign In</button>
    </form>
  </div>

  
  
</div>
{% endblock %}
